<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatsong Uploader</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        form { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        input, button { padding: 15px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Chatsong Video-Reply</h2>
    <form action="https://pixeldrain.com/api/file/" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="video/*,audio/*" capture="environment" required>
        <button type="submit">Uploaden</button>
    </form>
    <p><small>Let op: Na het klikken word je doorgestuurd naar een resultaatpagina van Pixeldrain.</small></p>
</body>
</html>
