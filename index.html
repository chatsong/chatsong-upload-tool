<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Chatsong Uploader</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; text-align: center; }
        input, button { padding: 15px; margin: 10px 0; width: 100%; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Chatsong Video-Reply</h2>
    <input type="file" id="fileInput" accept="video/*,audio/*">
    <button onclick="uploadFile()">Upload mijn Reply</button>
    <div id="status"></div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const file = fileInput.files[0];
            
            // PLAK HIER JE API KEY
            const apiKey = "6e7c41b3-da13-40c9-b404-e931b65685e6"; 

            if (!file) { alert("Selecteer een bestand!"); return; }
            status.innerText = "Uploaden naar Pixeldrain...";

            try {
                // De correcte manier voor Pixeldrain: Key als username, leeg wachtwoord
                const response = await fetch("https://pixeldrain.com/api/file/", {
                    method: "POST",
                    headers: {
                        "Authorization": "Basic " + btoa(apiKey + ":")
                    },
                    body: file
                });

                const data = await response.json();

                if (response.ok) {
                    const link = "https://pixeldrain.com/u/" + data.id;
                    status.innerHTML = `Gelukt! <br> <b>Kopieer deze link:</b><br><input value='${link}' style='width:90%; padding:5px; margin-top:10px;'>`;
                } else {
                    status.innerText = "Fout: " + (data.value || "Onbekende fout");
                }
            } catch (err) {
                status.innerText = "Verbindingsfout: " + err.message;
            }
        }
    </script>
</body>
</html>
